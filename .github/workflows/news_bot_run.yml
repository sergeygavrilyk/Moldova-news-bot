name: Run Moldova News Bot
run-name: ${{ inputs.dry_run && '🧪 DRY RUN (тестовий запуск)' || 'Run Moldova News Bot' }}

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Тестовий запуск: пости — в адмін-чат з позначкою ТЕСТ, БД не змінюється"
        type: boolean
        default: false

# Не більше одного запуску одночасно: новий чекає, поки завершиться попередній
# (захист від подвійної обробки беклогу і дублів у каналі)
concurrency:
  group: moldova-news-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # Звичайний запуск триває 3–5 хв; якщо щось зависло — зупинити через 20 хв
    timeout-minutes: 20
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run News Bot
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Необов'язково: списки моделей через кому (Settings -> Variables). Порожньо = значення з main.py
        GEMINI_FILTER_MODELS: ${{ vars.GEMINI_FILTER_MODELS }}
        GEMINI_TRANSLATE_MODELS: ${{ vars.GEMINI_TRANSLATE_MODELS }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        # setup_db.py змінює БД — у тестовому запуску не виконуємо
        if [ "$DRY_RUN" != "true" ]; then python setup_db.py; fi
        python main.py