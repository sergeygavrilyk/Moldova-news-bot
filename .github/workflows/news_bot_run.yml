name: Run Moldova News Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run News Bot
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Необов'язково: списки моделей через кому (Settings -> Variables). Порожньо = значення з main.py
        GEMINI_FILTER_MODELS: ${{ vars.GEMINI_FILTER_MODELS }}
        GEMINI_TRANSLATE_MODELS: ${{ vars.GEMINI_TRANSLATE_MODELS }}
      run: |
        python setup_db.py
        python main.py